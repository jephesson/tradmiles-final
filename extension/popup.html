<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 12px;
        width: 280px;
        color: #0f172a;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        font-size: 12px;
        color: #475569;
        margin: 0 0 8px;
        line-height: 1.4;
      }
      #status {
        font-size: 12px;
        font-weight: 600;
        margin-bottom: 10px;
      }
      button {
        width: 100%;
        height: 34px;
        border: 0;
        border-radius: 8px;
        background: #0f172a;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.55;
        cursor: default;
      }
      #hint {
        margin-top: 8px;
        font-size: 11px;
        color: #64748b;
        line-height: 1.35;
      }
    </style>
  </head>
  <body>
    <h1>TradeMiles LATAM <span id="ver" style="font-weight:500;color:#64748b"></span></h1>
    <p>Prepare na venda e abra a página de passageiros da LATAM.</p>
    <div id="status">Checando sessão…</div>
    <button id="fillBtn" type="button">Preencher esta aba</button>
    <div id="hint"></div>
    <script src="popup.js"></script>
  </body>
</html>
